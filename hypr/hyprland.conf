source=~/.config/hypr/catppuccin-mocha.conf

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# My current laptop's monitor doesn't neatly scale to 1.5x
monitor=eDP-1,preferred,auto,1.56667
monitor=DP-1,preferred,auto,1

exec-once = fcitx5-remote -r
exec-once = fcitx5 -d --replace
exec-once = fcitx5-remote -r
exec-once = waybar 
# exec-once = mpvpaper -o "input-ipc-server=/tmp/mpvpaper-socket" '*' ~/Videos/wallpaper-osaka.mp4  # mpvpaper is very demanding on my laptop
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = hyprctl setcursor capitaine-cursors-light 32
exec-once = hyprpaper
exec-once = alacritty -T "Update System" -e fish -c "update && read"

env = GTK_THEME,Breeze-Dark
env = XCURSOR_SIZE,24

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:capslock
    kb_rules =

    follow_mouse = 1
#	mouse_refocus = false

    touchpad {
        natural_scroll = yes 
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = $green $sapphire 45deg
    col.inactive_border = $crust

    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
	shadow {
		enabled = yes
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
	# no_gaps_when_only = 1
	workspace = w[t1], gapsout:0, gapsin:0, border:0, rounding:0
	workspace = w[tg1], gapsout:0, gapsin:0, border:0, rounding:0	
}

master {
	new_status = inherit
	# no_gaps_when_only = 1
	workspace = w[t1], gapsout:0, gapsin:0, border:0, rounding:0
	workspace = w[tg1], gapsout:0, gapsin:0, border:0, rounding:0
}

gestures {
    workspace_swipe = off
}

#Ported from an easier v1 rule.
windowrule = float, class:.*fcitx.*


#windowrulev2 = stayfocused, title:^()$,class:^(steam)$
#windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$


windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$


$mainMod = SUPER

bind = $mainMod, Q, exec, alacritty
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, dolphin
bind = $mainMod, F, togglefloating, 
bind = $mainMod, R, exec, wofi --show drun 
bind = $mainMod, P, pseudo, # dwindle layout only
bind = $mainMod, J, togglesplit, # dwindle layout only

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# # Custom Binds:
# Audio
bind = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% 
bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% 

# Music
bind = ,XF86AudioPrev, exec, mpc prev
bind = ,XF86AudioNext, exec, mpc next
bind = ,XF86AudioPlay, exec, mpc toggle
bind = ,XF86AudioStop, exec, mpc stop

# Screen Brightness
bind = ,XF86MonBrightnessDown, exec, light -N 0.1; light -U 10; light -N 0.00
bind = $mainMod, XF86MonBrightnessDown, exec, light -O; light -S 0
bind = $mainMod, XF86MonBrightnessUp, exec, light -I
bind = ,XF86MonBrightnessUp, exec, light -A 10

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy; wl-paste -n > "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%Y%m%d_%T_grim.png')" 
# bind = $mainMod, Print, exec, grim -o $(xdg-user-dir PICTURES)/screenshots/$(date +'%s_grim.png')

# Copy + Paste
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Split
bind=$mainMod,F1,exec,echo "split()" >> /tmp/nwsplit.sock
bind=$mainMod,F4,exec,echo "undo()" >> /tmp/nwsplit.sock
bind=$mainMod,F2,exec,echo "stop()" >> /tmp/nwsplit.sock
bind=$mainMod,F3,exec,echo "pause()" >> /tmp/nwsplit.sock
